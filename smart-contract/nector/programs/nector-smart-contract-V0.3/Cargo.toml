[package]
name = "nector-smart-contract-v0_3"
version = "0.1.0"
description = "Created by Nector"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nector_smart_contract_v0_3"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "associated_token", "token_2022"] }
mpl-core = { version = "0.11.1", default-features = false, features = ["anchor"] }

base64ct = "=1.7.1"
wincode-derive = "=0.5.0"
wincode = "=0.6.0"
signature = "=2.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
